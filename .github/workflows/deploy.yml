name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal permissions: read the repo, write to Pages, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Do not let a slow run queue behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# Quality gate — every step below is blocking.
# Order: npm ci → lint → typecheck → build → verify → theme → artifacts →
# science → visual → identity → works → test. Pages is configured, uploaded
# and deployed only after all twelve pass. A failing test means no
# deployment, without exception.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run verify

      - name: Check theme system
        run: npm run theme

      - name: Check artifacts
        run: npm run artifacts

      - name: Check science copy
        run: npm run science

      # v1.6: the visual gate now owns the background contract — the global
      # canvas must stay inert, themed, inside its opacity band, and must
      # carry mathematics, biology AND AI. It was missing from this pipeline.
      - name: Check visual system
        run: npm run visual

      - name: Check public identity
        run: npm run identity

      # v2.3: the Works contract. The fixed type/status/ratio enums, the poster
      # ladder, drafts never reaching a page, and no video bytes on any route.
      - name: Check works contract
        run: npm run works

      # Resolve the exact Playwright version so browser binaries are cached
      # against it rather than against a floating "latest" key.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
